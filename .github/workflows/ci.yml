name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Check & Build (sena-guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Release
        run: cargo build --release

      - name: Upload sena-guard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-guard
          path: target/release/sena-guard.exe
          if-no-files-found: error

  haskell:
    name: Haskell Check & Build (sena)
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.10.3.0'

      - name: Cache Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Roaming\cabal\store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Cabal Update
        run: cabal update

      - name: Cabal Build
        run: cabal build --enable-tests --ghc-options="-Werror"

      - name: Cabal Test
        run: cabal test --test-show-details=direct

      - name: Download sena-guard
        uses: actions/download-artifact@v4
        with:
          name: sena-guard
          path: staging

      - name: Stage Binaries
        shell: pwsh
        run: |
          $senaExe = Get-ChildItem -Path "dist-newstyle" -Filter "SenaVN.exe" -Recurse | Select-Object -First 1
          if (-not $senaExe) {
            Write-Error "SenaVN.exe not found in dist-newstyle"
            exit 1
          }
          Copy-Item -Path $senaExe.FullName -Destination "staging/sena.exe"
          Copy-Item -Path $senaExe.FullName -Destination "staging/SenaVN.exe"
          Get-ChildItem -Path "staging"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sena-windows-x64
          path: staging/*
          if-no-files-found: error
