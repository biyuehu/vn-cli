name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Check (sena-guard)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Release
        run: cargo build --release

  haskell:
    name: Haskell Check (sena)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.10.3.0'

      - name: Cache Cabal
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Roaming\cabal\store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Cabal Update
        run: cabal update

      - name: Cabal Build
        run: cabal build --enable-tests --ghc-options="-Werror"
